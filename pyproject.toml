[project]
name = "ghostpid"
version = "0.2.0"
description = "Anonimizador local y determinista de P&ID y PFD en PDF antes de usarlos con LLMs."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
dependencies = [
    "pymupdf>=1.24",
    "pikepdf>=9.0",
    "pdfplumber>=0.11",
    "opencv-python>=4.10",
    "pytesseract>=0.3.13",
    "pyyaml>=6.0",
    "pydantic>=2.14.4",
    "ruamel-yaml>=0.19.1",
    "pyqt6>=6.12.1",
]

[project.scripts]
sanitize = "sanitizer.cli:main"
inventory = "sanitizer.inventory:main"
validate-config = "sanitizer.rules:main"
clean-metadata = "sanitizer.metadata:main"
redact = "sanitizer.redact:main"
anonymize = "sanitizer.pipeline:main"
revert = "sanitizer.mapping:main"
audit = "sanitizer.audit:main"
review = "sanitizer.ui:main"
blacklist = "sanitizer.blacklist:main"

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
    "pytest>=8.0",
    "pytest-qt>=4.5.0",
    "reportlab>=4.2",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sanitizer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    # Avisos internos de los bindings SWIG de PyMuPDF, ajenos al proyecto
    "ignore:builtin type .* has no __module__ attribute:DeprecationWarning",
]
