[project]
name = "pid-anonymouse"
version = "0.1.0"
description = "Anonimizador local y determinista de P&ID y PFD en PDF antes de usarlos con LLMs."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pymupdf>=1.24",
    "pikepdf>=9.0",
    "pdfplumber>=0.11",
    "opencv-python>=4.10",
    "pytesseract>=0.3.13",
    "pyyaml>=6.0",
]

[project.scripts]
sanitize = "sanitizer.cli:main"
inventory = "sanitizer.inventory:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "reportlab>=4.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sanitizer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    # Avisos internos de los bindings SWIG de PyMuPDF, ajenos al proyecto
    "ignore:builtin type .* has no __module__ attribute:DeprecationWarning",
]
